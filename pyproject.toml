[project]
name = "tools4ynab"
dynamic = ["version"]  # from the git tag (v0.2.0 -> 0.2.0); see "Releasing" in the README
description = "Command-line tools to automate YNAB budgets"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.1",
]

[project.scripts]
tools4ynab = "tools4ynab.cli:cli"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/tools4ynab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Inline HTML email templates: long lines are clearer than artificial wrapping.
"src/tools4ynab/reports/render.py" = ["E501"]
